<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Selenium Parser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">Amazon Top-5 Parser</h2>

    <div class="card p-4 mb-4 shadow-sm bg-white">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">Оберіть категорію:</label>
                <select id="categorySelect" class="form-select">
                    <option value="">Завантаження...</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">Або вставте посилання вручну:</label>
                <input type="text" id="customUrl" class="form-control" placeholder="https://www.amazon.com/...">
            </div>
            <div class="col-12">
                <button onclick="startParsing()" id="parseBtn" class="btn btn-primary w-100 py-2 fw-bold">
                    Start Parsing (Selenium)
                </button>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
            <select id="sortBy" class="form-select w-auto" onchange="loadProducts()">
                <option value="rank">Сортувати: Топ продажів</option>
                <option value="price">Сортувати: Ціна (низька -> висока)</option>
            </select>
            <input type="number" id="minRating" class="form-control w-auto" placeholder="Мін. рейтинг (4.5)" step="0.1"
                onchange="loadProducts()">
        </div>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadProducts()">Оновити список</button>
    </div>

    <div id="results" class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-3">
    </div>
</div>

<script src="/static/js/script.js"></script>
</body>
</html>
